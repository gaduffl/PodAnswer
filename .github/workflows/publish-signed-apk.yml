name: Publish signed APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.2.0"
        required: true
        default: "v0.1.3"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and verify release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PATH: /tmp/podanswer-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required repository secret: $secret_name" >&2
              exit 1
            fi
          done

      - name: Select release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Restore release keystore
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Run tests and build signed release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Prepare published files
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/PodAnswer-${RELEASE_TAG}.apk"
          cd release
          sha256sum "PodAnswer-${RELEASE_TAG}.apk" > "PodAnswer-${RELEASE_TAG}.apk.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodAnswer-signed-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --generate-notes --title "PodAnswer $RELEASE_TAG"
          fi
