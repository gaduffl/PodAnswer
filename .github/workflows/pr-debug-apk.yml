name: PR debug APK

# Builds a test APK for every pull request against main. Publishes nothing:
# no release, no tag, only a short-lived workflow artifact.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-debug-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PodAnswer-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
